<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kumanda</title>
<style>
  :root{--bg:#0b0e14;--line:#2a3350;--acc:#4da3ff;--warn:#ff9f43;--txt:#cfd8ff}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif;color:var(--txt)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #bar{position:fixed;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;z-index:2;flex-wrap:nowrap;white-space:nowrap}
  #bar button{background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:13px}
  #bar button.active{border-color:var(--warn);color:var(--warn)}
  #info{font:11px monospace;opacity:.85;min-width:105px;text-align:center}

  /* Uygulamalar ve Ayarlar Panelleri */
  .modal{position:fixed;inset:0;background:rgba(11,14,20,.97);z-index:5;display:none;flex-direction:column;
    padding:12px 18px;box-sizing:border-box}
  .modal .top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  .modal .top h3{margin:0;flex:1;font-size:17px;color:var(--acc)}
  #q{flex:1;background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px}
  .modal .top button{background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:14px}
  #applist{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;
    align-content:start;touch-action:pan-y}
  #applist button{background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:10px;
    padding:13px 10px;font-size:14px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Ayarlar Icerigi */
  .settings-grid{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;touch-action:pan-y;padding-bottom:12px}
  .s-card{background:#13192b;border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
  .s-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
  .s-row label{flex:1}
  .s-row input[type="checkbox"]{width:20px;height:20px;accent-color:var(--acc)}
  .s-row input[type="range"]{width:120px;accent-color:var(--acc)}
  .s-row select{background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px}
  .s-sub{font-size:11px;color:#7f8db8}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="bar">
  <button id="modeBtn">Mod: IMLEC</button>
  <button id="editBtn" style="display:none">Tus Hedefi</button>
  <button id="resetBtn" style="display:none">Sifirla</button>
  <button id="appBtn">Uygulamalar</button>
  <button id="setBtn">⚙ Ayarlar</button>
  <button id="backBtn">Geri</button>
  <button id="syncBtn" title="GitHub'dan Yenile">↻</button>
  <span id="info">-</span>
</div>

<!-- Uygulama Secici -->
<div id="panel" class="modal">
  <div class="top">
    <input id="q" type="search" placeholder="Uygulama ara...">
    <button id="closeBtn">Kapat</button>
  </div>
  <div id="applist"></div>
</div>

<!-- Ayarlar Paneli -->
<div id="settingsModal" class="modal">
  <div class="top">
    <h3>Kumanda ve Kaydirma Ayarlari</h3>
    <button id="closeSetBtn">Kaydet & Kapat</button>
  </div>
  <div class="settings-grid">
    <div class="s-card">
      <div class="s-row">
        <label for="chkVBar">Sag Kenar Dikey Kaydirma Cubugu</label>
        <input id="chkVBar" type="checkbox">
      </div>
      <div class="s-sub">Sag kenarda yukari/asagi sayfa kaydirma seridi ve ▲/▼ tuslarini gosterir.</div>
      <div class="s-row">
        <label for="chkHBar">Alt Kenar Yatay Kaydirma Cubugu</label>
        <input id="chkHBar" type="checkbox">
      </div>
      <div class="s-sub">Alt kenarda sola/saga sayfa kaydirma seridi ve ◀/▶ tuslarini gosterir.</div>
    </div>

    <div class="s-card">
      <div class="s-row">
        <label for="selScrollDir">Kaydirma Yonu</label>
        <select id="selScrollDir">
          <option value="wheel">Tekerlek (Asagi cek = Sayfa iner)</option>
          <option value="touch">Dokunmatik (Yukari it = Sayfa iner)</option>
        </select>
      </div>
      <div class="s-row">
        <label for="chkTwoFinger">2 Parmakla Kaydirma (Dikey + Yatay)</label>
        <input id="chkTwoFinger" type="checkbox">
      </div>
      <div class="s-sub">Orta alanda 2 parmakla basip her yone (asagi/yukari/saga/sola) kaydirir.</div>
    </div>

    <div class="s-card">
      <div class="s-row">
        <label>Kaydirma Hizi: <span id="lblScrollSpeed">1.6x</span></label>
        <input id="rngScrollSpeed" type="range" min="0.6" max="3.2" step="0.2" value="1.6">
      </div>
      <div class="s-row">
        <label>Imlec Hizi: <span id="lblCurSpeed">1.3x</span></label>
        <input id="rngCurSpeed" type="range" min="0.6" max="2.6" step="0.1" value="1.3">
      </div>
      <div class="s-row">
        <label>Cubuk Genisligi: <span id="lblBarSize">56px</span></label>
        <input id="rngBarSize" type="range" min="40" max="84" step="4" value="56">
      </div>
    </div>
  </div>
</div>

<script>
/* ============ KULLANICI AYARLARI ============ */
const DEFAULT_SETTINGS = {
  vBar: true,          // Sag dikey kaydirma cubugu
  hBar: true,          // Alt yatay kaydirma cubugu
  twoFinger: true,     // 2 parmakla kaydirma
  scrollDir: 'wheel',  // 'wheel': cubugu asagi cekince sayfa asagi iner | 'touch': dokunmatik yonu
  scrollSpeed: 1.6,
  curSpeed: 1.3,
  barSize: 56
};

let CFG = Object.assign({}, DEFAULT_SETTINGS);
try {
  const s = JSON.parse(localStorage.getItem('m2t_cfg_v2') || '{}');
  CFG = Object.assign({}, DEFAULT_SETTINGS, s);
} catch(e) {}

function saveCfg(){
  try { localStorage.setItem('m2t_cfg_v2', JSON.stringify(CFG)); } catch(e) {}
}

/* ============ VARSAYILAN OYUN PROFILI ============ */
const DEFAULT_CONTROLS = [
  {tip:"cubuk", ad:"Yon", x:0.16, y:0.62, r:0.18, oyun:{x:0.16, y:0.72}, menzil:0.14},
  {tip:"dugme", ad:"A",   x:0.84, y:0.64, r:0.10, oyun:{x:0.86, y:0.75}},
  {tip:"dugme", ad:"B",   x:0.70, y:0.76, r:0.09, oyun:{x:0.74, y:0.85}},
  {tip:"dugme", ad:"X",   x:0.72, y:0.46, r:0.08, oyun:{x:0.76, y:0.55}},
  {tip:"dugme", ad:"Y",   x:0.86, y:0.40, r:0.08, oyun:{x:0.88, y:0.50}}
];

let controls = JSON.parse(JSON.stringify(DEFAULT_CONTROLS));
try {
  const savedProfile = localStorage.getItem('m2t_controls_v2');
  if (savedProfile) {
    const parsed = JSON.parse(savedProfile);
    if (Array.isArray(parsed) && parsed.length > 0) controls = parsed;
  }
} catch(e) {}

function saveControls(){
  try { localStorage.setItem('m2t_controls_v2', JSON.stringify(controls)); } catch(e) {}
}

let TV_ORAN = 16/9;
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const info = document.getElementById('info'), modeBtn = document.getElementById('modeBtn');
const editBtn = document.getElementById('editBtn'), resetBtn = document.getElementById('resetBtn');
let W=0, H=0, area={x:0,y:0,w:0,h:0};
let vBarRect = null, hBarRect = null;

const MODES = ['imlec', 'ayna', 'kumanda'];
let mode = 'imlec';
try {
  const saved = localStorage.getItem('m2t_mode');
  if (MODES.includes(saved)) mode = saved;
} catch(e) {}

// Touchpad (IMLEC) durumu
let curX = 0.5, curY = 0.5;
// Coklu parmak oturum kilidi: ekrana 2. parmak degdigi andan tum parmaklar kalkana kadar
// tek parmak tiklamalarini ve imlec sarsintilarini %100 engeller
let maxTouchesInGesture = 0;
let multiTouchEndedAt = 0;
let twoFingerPrev = null;

// Kumanda kalibrasyon durumu
let editMode = false;
let selectedCtrl = null;

window.setOran = function(w, h) {
  if (w > 0 && h > 0) {
    TV_ORAN = w / h;
    resize();
  }
};

function updateTopBar(){
  modeBtn.textContent = 'Mod: ' + mode.toUpperCase();
  if (mode === 'kumanda') {
    editBtn.style.display = 'inline-block';
    resetBtn.style.display = editMode ? 'inline-block' : 'none';
    editBtn.classList.toggle('active', editMode);
    editBtn.textContent = editMode ? 'Kaydet / Bitir' : 'Tus Hedefi';
  } else {
    editMode = false;
    selectedCtrl = null;
    editBtn.style.display = 'none';
    resetBtn.style.display = 'none';
  }
}

function computeLayout(){
  const bs = CFG.barSize;
  const rightPad = (mode !== 'kumanda' && CFG.vBar) ? (bs + 10) : 0;
  const bottomPad = (mode !== 'kumanda' && CFG.hBar) ? (bs + 10) : 0;
  const topPad = 46;
  const availW = Math.max(100, W - rightPad - 16);
  const availH = Math.max(100, H - topPad - bottomPad - 8);

  let aw = availW, ah = aw / TV_ORAN;
  if (ah > availH) { ah = availH; aw = ah * TV_ORAN; }
  area = {
    x: 8 + (availW - aw) / 2,
    y: topPad + (availH - ah) / 2,
    w: aw,
    h: ah
  };

  if (mode !== 'kumanda' && CFG.vBar) {
    vBarRect = { x: W - bs - 4, y: topPad, w: bs, h: H - topPad - bottomPad - 6, btnH: 44 };
  } else {
    vBarRect = null;
  }

  if (mode !== 'kumanda' && CFG.hBar) {
    hBarRect = { x: 8, y: H - bs - 4, w: W - rightPad - 16, h: bs, btnW: 48 };
  } else {
    hBarRect = null;
  }
}

function resize(){
  const d = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W*d; cv.height = H*d;
  cx.setTransform(d,0,0,d,0,0);
  computeLayout();
  updateTopBar();
  draw();
}
addEventListener('resize', resize);

function send(a,id,nx,ny){
  nx = Math.min(1, Math.max(0, nx)); ny = Math.min(1, Math.max(0, ny));
  try { if (window.Android) Android.touch(a,id,nx,ny); } catch(e) {}
}

/* ============ DOKUNMA ALGILAMAYAN SAF KAYDIRMA MOTORU (SCROLL ENGINE) ============
   Neden onceki kaydirma tiklama gibi algilaniyordu?
   - Cunku parmak degdigi anda (henuz hareket etmeden) ACTION_DOWN gonderiliyordu.
   Yeni Mimari:
   1. Cubuga veya 2 parmakla ekrana dokundugunuzda TV'ye HICBIR dokunus gonderilmez.
   2. Sadece parmaginiz kaydirma esigini (> 5px) astigi anda (0.50, 0.50) noktasindan
      ACTION_DOWN baslatilir ve AYNI ANDA Android'in TouchSlop esigini (0.04 = ~45px)
      asan ilk ACTION_MOVE gonderilir; boylece Android altindaki butona/linke basmak
      yerine hareketi %100 SCROLL (sayfa kaydirma) olarak yakalar! */
const SCROLL_PID = 9;
let scroller = {
  down: false,
  resetting: false,
  sx: 0.5,
  sy: 0.5,
  thumbV: 0.5,
  thumbH: 0.5,
  animTimer: null
};

function feedScrollDelta(normDx, normDy){
  if (scroller.resetting) return;
  if (scroller.animTimer) { clearInterval(scroller.animTimer); scroller.animTimer = null; }

  const dirSign = (CFG.scrollDir === 'wheel') ? -1 : 1;
  const moveX = normDx * CFG.scrollSpeed * dirSign;
  const moveY = normDy * CFG.scrollSpeed * dirSign;

  scroller.thumbV = Math.min(1, Math.max(0, scroller.thumbV + normDy * 1.3));
  scroller.thumbH = Math.min(1, Math.max(0, scroller.thumbH + normDx * 1.3));

  if (!scroller.down) {
    // Ilk kaydirma hareketi: merkezde baslat ve TouchSlop esigini aninda gec!
    scroller.down = true;
    scroller.sx = 0.50;
    scroller.sy = 0.50;
    send(0, SCROLL_PID, scroller.sx, scroller.sy);

    const len = Math.hypot(moveX, moveY) || 1;
    const slopX = (moveX / len) * 0.038;
    const slopY = (moveY / len) * 0.038;
    scroller.sx = Math.min(0.90, Math.max(0.10, scroller.sx + slopX + moveX));
    scroller.sy = Math.min(0.90, Math.max(0.10, scroller.sy + slopY + moveY));
    send(2, SCROLL_PID, scroller.sx, scroller.sy);
    return;
  }

  let nx = scroller.sx + moveX;
  let ny = scroller.sy + moveY;

  if (nx < 0.08 || nx > 0.92 || ny < 0.08 || ny > 0.92) {
    // Ekran kenarina ulasildi: mevcut kaydirmayi birak, 55ms sonra merkezden yeni darbe baslat
    send(1, SCROLL_PID, scroller.sx, scroller.sy);
    scroller.down = false;
    scroller.resetting = true;
    setTimeout(() => {
      scroller.resetting = false;
    }, 55);
  } else {
    scroller.sx = nx;
    scroller.sy = ny;
    send(2, SCROLL_PID, scroller.sx, scroller.sy);
  }
}

function finishScrollGesture(){
  if (scroller.down) {
    send(1, SCROLL_PID, scroller.sx, scroller.sy);
    scroller.down = false;
  }
  scroller.resetting = false;
  scroller.thumbV = 0.5;
  scroller.thumbH = 0.5;
  setTimeout(() => send(3, 0, curX, curY), 25);
}

/** ▲ / ▼ / ◀ / ▶ dugmeleri icin dokunma algilamayan hizli sayfa kaydirma */
function triggerSmoothSwipe(dirX, dirY){
  finishScrollGesture();
  if (scroller.animTimer) { clearInterval(scroller.animTimer); scroller.animTimer = null; }
  const startX = 0.50;
  const startY = 0.50;
  const endX   = 0.50 + dirX * 0.34;
  const endY   = 0.50 + dirY * 0.36;
  const steps = 8;
  let step = 0;
  send(0, SCROLL_PID, startX, startY);
  // Ilk adimda TouchSlop esigini aninda gec
  send(2, SCROLL_PID, startX + dirX * 0.05, startY + dirY * 0.05);
  scroller.animTimer = setInterval(() => {
    step++;
    const t = step / steps;
    const cxPos = startX + (endX - startX) * t;
    const cyPos = startY + (endY - startY) * t;
    if (step < steps) {
      send(2, SCROLL_PID, cxPos, cyPos);
    } else {
      send(2, SCROLL_PID, endX, endY);
      send(1, SCROLL_PID, endX, endY);
      clearInterval(scroller.animTimer);
      scroller.animTimer = null;
      setTimeout(() => send(3, 0, curX, curY), 30);
    }
  }, 14);
}

// Parmak kimligi -> kucuk tamsayi
const idmap = new Map();
function pid(t){
  if (!idmap.has(t.identifier)) {
    const used = new Set(idmap.values()); let n = 0;
    while (used.has(n)) n++;
    idmap.set(t.identifier, n);
  }
  return idmap.get(t.identifier);
}
const active = new Map(); // touch.identifier -> durum

function hitControl(x,y){
  for (const c of controls) {
    const dx = x - c.x*W, dy = y - c.y*H;
    if (Math.hypot(dx,dy) <= c.r*H) return c;
  }
  return null;
}

function inRect(x, y, r){
  return !!(r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
}

// Orta kesikli alanda kac aktif parmak oldugunu bulur
function getAreaTouches(touchList){
  const res = [];
  for (const t of touchList) {
    const a = active.get(t.identifier);
    if (a && (a.kind === 'vscroll' || a.kind === 'hscroll' || a.kind === 'scroll_btn')) continue;
    if (inRect(t.clientX, t.clientY, area) || (a && a.kind === 'trackpad')) {
      res.push(t);
    }
  }
  return res;
}

function onStart(e){
  e.preventDefault();
  const now = performance.now();

  // 1) Sag Dikey veya Alt Yatay Kaydirma Cubugu kontrolu (Dokunma/Tiklama uretmez!)
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    if (inRect(x, y, vBarRect)) {
      if (y < vBarRect.y + vBarRect.btnH) {
        active.set(t.identifier, { kind: 'scroll_btn' });
        triggerSmoothSwipe(0, +1);
        info.textContent = 'SAYFA ▲';
      } else if (y > vBarRect.y + vBarRect.h - vBarRect.btnH) {
        active.set(t.identifier, { kind: 'scroll_btn' });
        triggerSmoothSwipe(0, -1);
        info.textContent = 'SAYFA ▼';
      } else {
        // Sadece kaydirma durumu olustur; parmak kayana kadar TV'ye dokunus gonderme!
        active.set(t.identifier, { kind: 'vscroll', sy: y, ly: y, started: false });
        info.textContent = 'DIKEY CUBUK';
      }
      draw();
      continue;
    }
    if (inRect(x, y, hBarRect)) {
      if (x < hBarRect.x + hBarRect.btnW) {
        active.set(t.identifier, { kind: 'scroll_btn' });
        triggerSmoothSwipe(+1, 0);
        info.textContent = 'SAYFA ◀';
      } else if (x > hBarRect.x + hBarRect.w - hBarRect.btnW) {
        active.set(t.identifier, { kind: 'scroll_btn' });
        triggerSmoothSwipe(-1, 0);
        info.textContent = 'SAYFA ▶';
      } else {
        active.set(t.identifier, { kind: 'hscroll', sx: x, lx: x, started: false });
        info.textContent = 'YATAY CUBUK';
      }
      draw();
      continue;
    }
  }

  // 2) IMLEC Modu: Yalnizca ortadaki kesikli cizgili dikdortgen (area) icindeki dokunuslari kabul et!
  if (mode === 'imlec') {
    for (const t of e.changedTouches) {
      if (active.has(t.identifier)) continue; // cubuktaki parmaklari atla
      const x = t.clientX, y = t.clientY;
      // Ortadaki kesikli alanin disindaki dokunuslari tamamen yoksay!
      if (!inRect(x, y, area)) continue;

      const p = pid(t);
      const state = {
        kind: 'trackpad', p,
        sx: x, sy: y, lx: x, ly: y,
        t0: now, moved: false, dragging: false, holdTimer: null
      };
      active.set(t.identifier, state);
    }

    const areaTouches = getAreaTouches(e.touches);
    if (areaTouches.length > maxTouchesInGesture) {
      maxTouchesInGesture = areaTouches.length;
    }

    if (CFG.twoFinger && areaTouches.length >= 2) {
      // 2. parmak algilandi: tum tek-parmak surukleme/tiklama zamanlayicilarini iptal et!
      for (const a of active.values()) {
        if (a.holdTimer) { clearTimeout(a.holdTimer); a.holdTimer = null; }
        if (a.dragging) { send(1, a.p, curX, curY); a.dragging = false; }
      }
      const t0 = areaTouches[0], t1 = areaTouches[1];
      twoFingerPrev = {
        x: (t0.clientX + t1.clientX) / 2,
        y: (t0.clientY + t1.clientY) / 2,
        sx: (t0.clientX + t1.clientX) / 2,
        sy: (t0.clientY + t1.clientY) / 2,
        moved: false
      };
      info.textContent = '2P KAYDIRMA HAZIR';
      draw();
      return;
    }

    // Tek parmak ise: 2. parmagin gecikmeli basma ihtimaline karsi basili-tutma zamanlayicisini 420ms kur
    if (areaTouches.length === 1 && maxTouchesInGesture === 1) {
      const t0 = areaTouches[0];
      const st = active.get(t0.identifier);
      if (st && !st.holdTimer) {
        st.holdTimer = setTimeout(() => {
          if (maxTouchesInGesture === 1 && !st.moved && active.has(t0.identifier)) {
            st.dragging = true;
            send(0, st.p, curX, curY);
            info.textContent = 'SURUKLE: ' + curX.toFixed(2) + ',' + curY.toFixed(2);
            draw();
          }
        }, 420);
      }
      send(3, 0, curX, curY);
      info.textContent = curX.toFixed(3) + ' , ' + curY.toFixed(3);
    }
    draw();
    return;
  }

  // 3) AYNA ve KUMANDA Modlari
  for (const t of e.changedTouches) {
    if (active.has(t.identifier)) continue;
    const x = t.clientX, y = t.clientY;
    if (mode === 'ayna') {
      // AYNA modunda da sadece ortadaki kesikli alan icindeki dokunuslar oyuna gider!
      if (!inRect(x, y, area)) continue;
      const nx = (x-area.x)/area.w, ny = (y-area.y)/area.h, p = pid(t);
      active.set(t.identifier, {kind:'pad', p, nx, ny});
      send(0,p,nx,ny);
      info.textContent = nx.toFixed(3)+' , '+ny.toFixed(3);
    } else if (mode === 'kumanda') {
      if (editMode) {
        const c = hitControl(x,y);
        if (c) {
          selectedCtrl = c;
          active.set(t.identifier, {kind:'edit_btn', c, lx:x, ly:y});
          send(3, 0, c.oyun.x, c.oyun.y);
          info.textContent = c.ad + ' -> ' + c.oyun.x.toFixed(2) + ',' + c.oyun.y.toFixed(2);
        } else if (selectedCtrl) {
          active.set(t.identifier, {kind:'edit_target', c:selectedCtrl, lx:x, ly:y});
          send(3, 0, selectedCtrl.oyun.x, selectedCtrl.oyun.y);
        }
      } else {
        const c = hitControl(x,y); if (!c) continue;
        const p = pid(t);
        active.set(t.identifier, {kind:c.tip, c, p, nx:c.oyun.x, ny:c.oyun.y, kx:0, ky:0});
        send(0,p,c.oyun.x,c.oyun.y);
        info.textContent = c.ad + ' (' + c.oyun.x.toFixed(2) + ',' + c.oyun.y.toFixed(2) + ')';
      }
    }
  }
  draw();
}

function onMove(e){
  e.preventDefault();
  const now = performance.now();

  // 1) Sag ve Alt Kaydirma Cubugu suruklemesi
  for (const t of e.changedTouches) {
    const a = active.get(t.identifier);
    if (!a) continue;
    if (a.kind === 'vscroll') {
      if (!a.started && Math.abs(t.clientY - a.sy) < 5) continue;
      a.started = true;
      const dy = t.clientY - a.ly;
      a.ly = t.clientY;
      const trackH = Math.max(90, (vBarRect ? vBarRect.h - 2 * vBarRect.btnH : H * 0.65));
      feedScrollDelta(0, dy / trackH);
      info.textContent = 'KAYDIR ⇅';
      draw();
    } else if (a.kind === 'hscroll') {
      if (!a.started && Math.abs(t.clientX - a.sx) < 5) continue;
      a.started = true;
      const dx = t.clientX - a.lx;
      a.lx = t.clientX;
      const trackW = Math.max(90, (hBarRect ? hBarRect.w - 2 * hBarRect.btnW : W * 0.65));
      feedScrollDelta(dx / trackW, 0);
      info.textContent = 'KAYDIR ⇄';
      draw();
    }
  }

  // 2) IMLEC Modu Hareketleri
  if (mode === 'imlec') {
    const areaTouches = getAreaTouches(e.touches);
    if (areaTouches.length > maxTouchesInGesture) {
      maxTouchesInGesture = areaTouches.length;
    }

    // 2 Parmakla Hem Dikey Hem Yatay Kaydirma
    if (CFG.twoFinger && areaTouches.length >= 2) {
      const t0 = areaTouches[0], t1 = areaTouches[1];
      const mx = (t0.clientX + t1.clientX) / 2;
      const my = (t0.clientY + t1.clientY) / 2;
      if (!twoFingerPrev) {
        twoFingerPrev = { x: mx, y: my, sx: mx, sy: my, moved: false };
      }
      const totalDist = Math.hypot(mx - twoFingerPrev.sx, my - twoFingerPrev.sy);
      if (!twoFingerPrev.moved && totalDist < 6) return;
      twoFingerPrev.moved = true;

      const dx = mx - twoFingerPrev.x;
      const dy = my - twoFingerPrev.y;
      twoFingerPrev.x = mx;
      twoFingerPrev.y = my;

      feedScrollDelta(dx / area.w, dy / area.h);
      info.textContent = '2P KAYDIR ⇅⇄';
      draw();
      return;
    }

    // Eger bu oturumda 2 parmak kullanildiysa veya 2 parmak yeni birakildiysa imleci kipirdatma!
    if (maxTouchesInGesture >= 2 || now < multiTouchEndedAt + 140) return;

    for (const t of e.changedTouches) {
      const a = active.get(t.identifier);
      if (!a || a.kind !== 'trackpad') continue;
      const x = t.clientX, y = t.clientY;
      // Ilk 35ms icinde 2. parmagin basmasini bekle (kucuk ms farklarinda imlec kaymasin)
      if (!a.moved && (now - a.t0) < 35 && Math.hypot(x - a.sx, y - a.sy) < 10) continue;

      const dx = x - a.lx, dy = y - a.ly;
      a.lx = x; a.ly = y;
      if (Math.hypot(x - a.sx, y - a.sy) > 7) {
        a.moved = true;
        if (a.holdTimer) { clearTimeout(a.holdTimer); a.holdTimer = null; }
      }
      if (!a.moved) continue;

      const sens = CFG.curSpeed;
      curX = Math.min(1, Math.max(0, curX + (dx / area.w) * sens));
      curY = Math.min(1, Math.max(0, curY + (dy / area.h) * sens));
      if (a.dragging) {
        send(2, a.p, curX, curY);
      } else {
        send(3, a.p, curX, curY);
      }
      info.textContent = curX.toFixed(3)+' , '+curY.toFixed(3);
    }
    draw();
    return;
  }

  // 3) AYNA ve KUMANDA Modu Hareketleri
  for (const t of e.changedTouches) {
    const a = active.get(t.identifier); if (!a) continue;
    const x = t.clientX, y = t.clientY;
    if (a.kind === 'pad') {
      a.nx = (x-area.x)/area.w; a.ny = (y-area.y)/area.h;
      send(2,a.p,a.nx,a.ny);
      info.textContent = Math.min(1,Math.max(0,a.nx)).toFixed(3)+' , '+Math.min(1,Math.max(0,a.ny)).toFixed(3);
    } else if (a.kind === 'cubuk') {
      const c = a.c, R = c.r*H;
      let dx = (x - c.x*W)/R, dy = (y - c.y*H)/R;
      const len = Math.hypot(dx,dy);
      if (len > 1) { dx /= len; dy /= len; }
      a.kx = dx; a.ky = dy;
      a.nx = c.oyun.x + dx*c.menzil/TV_ORAN;
      a.ny = c.oyun.y + dy*c.menzil;
      send(2,a.p,a.nx,a.ny);
    } else if (a.kind === 'edit_btn' || a.kind === 'edit_target') {
      const c = a.c;
      const dx = x - a.lx, dy = y - a.ly;
      a.lx = x; a.ly = y;
      c.oyun.x = Math.min(0.98, Math.max(0.02, c.oyun.x + (dx / area.w)));
      c.oyun.y = Math.min(0.98, Math.max(0.02, c.oyun.y + (dy / area.h)));
      saveControls();
      send(3, 0, c.oyun.x, c.oyun.y);
      info.textContent = c.ad + ' -> ' + c.oyun.x.toFixed(2) + ',' + c.oyun.y.toFixed(2);
    }
  }
  draw();
}

function onEnd(e){
  e.preventDefault();
  const now = performance.now();

  // 1) Kaydirma cubugu parmak birakma
  for (const t of e.changedTouches) {
    const a = active.get(t.identifier);
    if (a && (a.kind === 'vscroll' || a.kind === 'hscroll' || a.kind === 'scroll_btn')) {
      if (a.kind === 'vscroll' || a.kind === 'hscroll') {
        finishScrollGesture();
      }
      active.delete(t.identifier);
      idmap.delete(t.identifier);
    }
  }

  // 2) IMLEC Modu parmak birakma
  if (mode === 'imlec') {
    const areaTouchesRemaining = getAreaTouches(e.touches);
    if (maxTouchesInGesture >= 2 && areaTouchesRemaining.length < 2) {
      finishScrollGesture();
      twoFingerPrev = null;
      multiTouchEndedAt = now;
    }

    for (const t of e.changedTouches) {
      const a = active.get(t.identifier);
      if (a && a.kind === 'trackpad') {
        if (a.holdTimer) { clearTimeout(a.holdTimer); a.holdTimer = null; }
        if (a.dragging) {
          send(1, a.p, curX, curY);
        } else if (
          maxTouchesInGesture === 1 &&
          (now > multiTouchEndedAt + 150) &&
          !a.moved &&
          (now - a.t0) < 270
        ) {
          // YALNIZCA bastan sona tek parmak kullanildiysa ve hic kaydirilmadiysa tikla!
          const p = a.p;
          const tx = curX, ty = curY;
          send(0, p, tx, ty);
          setTimeout(() => send(1, p, tx, ty), 40);
          info.textContent = 'TIK: ' + tx.toFixed(2) + ',' + ty.toFixed(2);
        }
        active.delete(t.identifier);
      }
      idmap.delete(t.identifier);
    }

    if (areaTouchesRemaining.length === 0) {
      maxTouchesInGesture = 0;
      twoFingerPrev = null;
    }
    draw();
    return;
  }

  // 3) AYNA ve KUMANDA Modu parmak birakma
  for (const t of e.changedTouches) {
    const a = active.get(t.identifier); if (!a) continue;
    if (a.kind === 'pad' || a.kind === 'cubuk' || a.kind === 'dugme') {
      send(1,a.p,a.nx,a.ny);
    }
    active.delete(t.identifier);
    idmap.delete(t.identifier);
  }
  draw();
}

['touchstart','touchmove','touchend','touchcancel'].forEach((n,i)=>{
  cv.addEventListener(n, [onStart,onMove,onEnd,onEnd][i], {passive:false});
});

modeBtn.addEventListener('click', ()=>{
  finishScrollGesture();
  const idx = (MODES.indexOf(mode) + 1) % MODES.length;
  mode = MODES[idx];
  try { localStorage.setItem('m2t_mode', mode); } catch(e) {}
  info.textContent = '-';
  computeLayout();
  updateTopBar();
  draw();
});

editBtn.addEventListener('click', ()=>{
  editMode = !editMode;
  if (editMode && !selectedCtrl) selectedCtrl = controls[0];
  if (editMode && selectedCtrl) {
    send(3, 0, selectedCtrl.oyun.x, selectedCtrl.oyun.y);
    info.textContent = selectedCtrl.ad + ' -> ' + selectedCtrl.oyun.x.toFixed(2) + ',' + selectedCtrl.oyun.y.toFixed(2);
  } else {
    info.textContent = 'Kaydedildi';
  }
  updateTopBar();
  draw();
});

resetBtn.addEventListener('click', ()=>{
  controls = JSON.parse(JSON.stringify(DEFAULT_CONTROLS));
  saveControls();
  selectedCtrl = controls[0];
  info.textContent = 'Varsayilana donuldu';
  draw();
});

document.getElementById('syncBtn').addEventListener('click', ()=>{
  try { if (window.Android && Android.refreshFromGithub) Android.refreshFromGithub(); } catch(e) {}
});

/* ---------- Ayarlar Modal Mantigi ---------- */
const settingsModal = document.getElementById('settingsModal');
const chkVBar = document.getElementById('chkVBar');
const chkHBar = document.getElementById('chkHBar');
const chkTwoFinger = document.getElementById('chkTwoFinger');
const selScrollDir = document.getElementById('selScrollDir');
const rngScrollSpeed = document.getElementById('rngScrollSpeed');
const lblScrollSpeed = document.getElementById('lblScrollSpeed');
const rngCurSpeed = document.getElementById('rngCurSpeed');
const lblCurSpeed = document.getElementById('lblCurSpeed');
const rngBarSize = document.getElementById('rngBarSize');
const lblBarSize = document.getElementById('lblBarSize');

function syncSettingsUI(){
  chkVBar.checked = !!CFG.vBar;
  chkHBar.checked = !!CFG.hBar;
  chkTwoFinger.checked = !!CFG.twoFinger;
  selScrollDir.value = CFG.scrollDir || 'wheel';
  rngScrollSpeed.value = CFG.scrollSpeed;
  lblScrollSpeed.textContent = Number(CFG.scrollSpeed).toFixed(1) + 'x';
  rngCurSpeed.value = CFG.curSpeed;
  lblCurSpeed.textContent = Number(CFG.curSpeed).toFixed(1) + 'x';
  rngBarSize.value = CFG.barSize;
  lblBarSize.textContent = CFG.barSize + 'px';
}

document.getElementById('setBtn').addEventListener('click', ()=>{
  syncSettingsUI();
  settingsModal.style.display = 'flex';
});

document.getElementById('closeSetBtn').addEventListener('click', ()=>{
  CFG.vBar = chkVBar.checked;
  CFG.hBar = chkHBar.checked;
  CFG.twoFinger = chkTwoFinger.checked;
  CFG.scrollDir = selScrollDir.value;
  CFG.scrollSpeed = parseFloat(rngScrollSpeed.value);
  CFG.curSpeed = parseFloat(rngCurSpeed.value);
  CFG.barSize = parseInt(rngBarSize.value, 10);
  saveCfg();
  settingsModal.style.display = 'none';
  computeLayout();
  draw();
});

rngScrollSpeed.addEventListener('input', ()=> lblScrollSpeed.textContent = Number(rngScrollSpeed.value).toFixed(1) + 'x');
rngCurSpeed.addEventListener('input', ()=> lblCurSpeed.textContent = Number(rngCurSpeed.value).toFixed(1) + 'x');
rngBarSize.addEventListener('input', ()=> lblBarSize.textContent = rngBarSize.value + 'px');

/* ---------- Cizim (Touchpad + Scrollbarlar + Kumanda) ---------- */
function drawScrollbars(){
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';

  // Sag Dikey Kaydirma Cubugu
  if (vBarRect) {
    const r = vBarRect;
    cx.fillStyle = '#141b2d';
    cx.strokeStyle = scroller.down ? '#ff9f43' : '#2a3350';
    cx.lineWidth = 1.5;
    cx.beginPath();
    cx.roundRect(r.x, r.y, r.w, r.h, 10);
    cx.fill();
    cx.stroke();

    cx.strokeStyle = '#2a3350';
    cx.beginPath();
    cx.moveTo(r.x, r.y + r.btnH); cx.lineTo(r.x + r.w, r.y + r.btnH);
    cx.moveTo(r.x, r.y + r.h - r.btnH); cx.lineTo(r.x + r.w, r.y + r.h - r.btnH);
    cx.stroke();

    cx.fillStyle = '#4da3ff';
    cx.font = 'bold 16px system-ui';
    cx.fillText('▲', r.x + r.w/2, r.y + r.btnH/2);
    cx.fillText('▼', r.x + r.w/2, r.y + r.h - r.btnH/2);

    const trackY = r.y + r.btnH + 16;
    const trackH = Math.max(20, r.h - 2 * r.btnH - 32);
    const ty = trackY + scroller.thumbV * trackH;
    cx.fillStyle = scroller.down ? '#ff9f43' : '#2b3b66';
    cx.beginPath();
    cx.roundRect(r.x + 6, ty - 18, r.w - 12, 36, 7);
    cx.fill();
    cx.fillStyle = '#cfd8ff';
    cx.font = '12px system-ui';
    cx.fillText('⇅', r.x + r.w/2, ty);
  }

  // Alt Yatay Kaydirma Cubugu
  if (hBarRect) {
    const r = hBarRect;
    cx.fillStyle = '#141b2d';
    cx.strokeStyle = scroller.down ? '#ff9f43' : '#2a3350';
    cx.lineWidth = 1.5;
    cx.beginPath();
    cx.roundRect(r.x, r.y, r.w, r.h, 10);
    cx.fill();
    cx.stroke();

    cx.strokeStyle = '#2a3350';
    cx.beginPath();
    cx.moveTo(r.x + r.btnW, r.y); cx.lineTo(r.x + r.btnW, r.y + r.h);
    cx.moveTo(r.x + r.w - r.btnW, r.y); cx.lineTo(r.x + r.w - r.btnW, r.y + r.h);
    cx.stroke();

    cx.fillStyle = '#4da3ff';
    cx.font = 'bold 15px system-ui';
    cx.fillText('◀', r.x + r.btnW/2, r.y + r.h/2);
    cx.fillText('▶', r.x + r.w - r.btnW/2, r.y + r.h/2);

    const trackX = r.x + r.btnW + 22;
    const trackW = Math.max(20, r.w - 2 * r.btnW - 44);
    const tx = trackX + scroller.thumbH * trackW;
    cx.fillStyle = scroller.down ? '#ff9f43' : '#2b3b66';
    cx.beginPath();
    cx.roundRect(tx - 22, r.y + 6, 44, r.h - 12, 7);
    cx.fill();
    cx.fillStyle = '#cfd8ff';
    cx.font = '12px system-ui';
    cx.fillText('⇄', tx, r.y + r.h/2);
  }
}

function draw(){
  cx.fillStyle = '#0b0e14'; cx.fillRect(0,0,W,H);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';

  if (mode === 'imlec') {
    cx.fillStyle = '#0e131d';
    cx.fillRect(area.x, area.y, area.w, area.h);
    cx.strokeStyle = scroller.down ? '#ff9f43' : '#3a4870';
    cx.lineWidth = 2; cx.setLineDash([8,6]);
    cx.strokeRect(area.x, area.y, area.w, area.h); cx.setLineDash([]);
    cx.fillStyle = '#4da3ff'; cx.font = '15px system-ui';
    cx.fillText('DOKUNMA ALANI: Sadece bu cizgili kutu icinde imlec ve tiklama calisir', area.x + area.w/2, area.y + area.h/2 - 14);
    cx.fillStyle = '#5c6b9c'; cx.font = '13px system-ui';
    cx.fillText('2 Parmakla veya Sag/Alt Cubukla tiklamadan her yone kaydirin (⇅ ⇄)', area.x + area.w/2, area.y + area.h/2 + 14);
    const px = area.x + curX * area.w, py = area.y + curY * area.h;
    cx.strokeStyle = scroller.down ? '#ff9f43' : '#4da3ff'; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(px, py, 12, 0, Math.PI*2); cx.stroke();
    drawScrollbars();
    return;
  }

  if (mode === 'ayna') {
    cx.fillStyle = '#0e131d';
    cx.fillRect(area.x, area.y, area.w, area.h);
    cx.strokeStyle = '#3a4870'; cx.lineWidth = 2; cx.setLineDash([8,6]);
    cx.strokeRect(area.x, area.y, area.w, area.h); cx.setLineDash([]);
    cx.fillStyle = '#34406a'; cx.font = '15px system-ui';
    cx.fillText('AYNA ALANI: Sadece bu cizgili kutu icindeki dokunus oyuna gider', area.x + area.w/2, area.y + area.h/2 - 10);
    cx.fillText('(Sag ve alt cubuklarla dokunmadan sayfayi kaydirabilirsiniz)', area.x + area.w/2, area.y + area.h/2 + 18);
    drawScrollbars();
    return;
  }

  if (editMode) {
    cx.fillStyle = '#ff9f43'; cx.font = '14px system-ui';
    cx.fillText('AYAR MODU: Bir tusa dokunun, ardindan parmaginizi kaydirarak TV\'deki mavi imleci oyundaki tusun uzerine getirin', W/2, 52);
  }
  for (const c of controls) {
    const px = c.x*W, py = c.y*H, R = c.r*H;
    let st = null;
    for (const a of active.values()) if (a.c === c) st = a;
    const isSel = editMode && selectedCtrl === c;
    cx.lineWidth = isSel ? 4 : 3;
    cx.strokeStyle = isSel ? '#ff9f43' : (st ? '#4da3ff' : '#2a3350');
    cx.beginPath(); cx.arc(px,py,R,0,Math.PI*2); cx.stroke();
    if (c.tip === 'cubuk') {
      const kx = (st && st.kx) ? st.kx : 0, ky = (st && st.ky) ? st.ky : 0;
      cx.fillStyle = isSel ? '#ff9f43' : (st ? '#4da3ff' : '#1d2644');
      cx.beginPath(); cx.arc(px+kx*R, py+ky*R, R*0.38, 0, Math.PI*2); cx.fill();
    } else {
      if (st || isSel) {
        cx.fillStyle = isSel ? 'rgba(255,159,67,.25)' : 'rgba(77,163,255,.35)';
        cx.beginPath(); cx.arc(px,py,R,0,Math.PI*2); cx.fill();
      }
      cx.fillStyle = '#cfd8ff'; cx.font = 'bold 20px system-ui';
      cx.fillText(c.ad || '', px, py);
    }
    if (editMode) {
      cx.fillStyle = '#8fa4d4'; cx.font = '11px monospace';
      cx.fillText(c.oyun.x.toFixed(2)+','+c.oyun.y.toFixed(2), px, py + R + 14);
    }
  }
}

/* ---------- Uygulama degistirici + Geri ---------- */
const panel = document.getElementById('panel'), applist = document.getElementById('applist');
const q = document.getElementById('q');
let APPS = null;
function loadApps(){
  if (APPS) return APPS;
  try { APPS = JSON.parse((window.Android && Android.apps) ? Android.apps() : '[]'); } catch(e) { APPS = []; }
  return APPS;
}
function getRecent(){ try { return JSON.parse(localStorage.getItem('m2t_recent') || '[]'); } catch(e) { return []; } }
function pushRecent(c){
  try { localStorage.setItem('m2t_recent', JSON.stringify([c, ...getRecent().filter(x => x !== c)].slice(0,8))); } catch(e) {}
}
function renderApps(){
  const f = q.value.trim().toLowerCase(), rec = getRecent();
  const items = loadApps().filter(a => !f || a.n.toLowerCase().includes(f));
  if (!f) items.sort((a,b) => {
    const ra = rec.indexOf(a.c), rb = rec.indexOf(b.c);
    if (ra >= 0 || rb >= 0) { if (ra < 0) return 1; if (rb < 0) return -1; return ra - rb; }
    return a.n.localeCompare(b.n, 'tr');
  });
  applist.textContent = '';
  for (const a of items) {
    const b = document.createElement('button');
    b.textContent = a.n;
    b.addEventListener('click', () => {
      pushRecent(a.c);
      try { Android.launch(a.c); } catch(e) {}
      panel.style.display = 'none';
    });
    applist.appendChild(b);
  }
}
document.getElementById('appBtn').addEventListener('click', () => {
  q.value = ''; renderApps(); panel.style.display = 'flex';
});
document.getElementById('closeBtn').addEventListener('click', () => { panel.style.display = 'none'; });
q.addEventListener('input', renderApps);
document.getElementById('backBtn').addEventListener('click', () => { try { Android.back(); } catch(e) {} });

resize();
