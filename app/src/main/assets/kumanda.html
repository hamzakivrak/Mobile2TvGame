<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kumanda</title>
<style>
  :root{--bg:#0b0e14;--line:#2a3350;--acc:#4da3ff;--warn:#ff9f43;--txt:#cfd8ff}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif;color:var(--txt)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #bar{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:2;flex-wrap:nowrap;white-space:nowrap}
  #bar button{background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px}
  #bar button.active{border-color:var(--warn);color:var(--warn)}
  #info{font:12px monospace;opacity:.85;min-width:115px;text-align:center}
  #panel{position:fixed;inset:0;background:rgba(11,14,20,.97);z-index:3;display:none;flex-direction:column;
    padding:10px 16px;box-sizing:border-box}
  #panel .top{display:flex;gap:10px;margin-bottom:10px}
  #q{flex:1;background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
  #panel .top button{background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:15px}
  #applist{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;
    align-content:start;touch-action:pan-y}
  #applist button{background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:10px;
    padding:14px 10px;font-size:15px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar">
  <button id="modeBtn">Mod: IMLEC</button>
  <button id="editBtn" style="display:none">Tus Hedefi Ayarla</button>
  <button id="resetBtn" style="display:none">Sifirla</button>
  <button id="appBtn">Uygulamalar</button>
  <button id="backBtn">Geri</button>
  <button id="syncBtn" title="GitHub'dan Yenile">↻</button>
  <span id="info">-</span>
</div>

<div id="panel">
  <div class="top">
    <input id="q" type="search" placeholder="Uygulama ara...">
    <button id="closeBtn">Kapat</button>
  </div>
  <div id="applist"></div>
</div>

<script>
/* ============ VARSAYILAN OYUN PROFILI ============ */
const DEFAULT_CONTROLS = [
  {tip:"cubuk", ad:"Yon", x:0.16, y:0.65, r:0.18, oyun:{x:0.16, y:0.72}, menzil:0.14},
  {tip:"dugme", ad:"A",   x:0.86, y:0.68, r:0.10, oyun:{x:0.86, y:0.75}},
  {tip:"dugme", ad:"B",   x:0.72, y:0.80, r:0.09, oyun:{x:0.74, y:0.85}},
  {tip:"dugme", ad:"X",   x:0.74, y:0.50, r:0.08, oyun:{x:0.76, y:0.55}},
  {tip:"dugme", ad:"Y",   x:0.88, y:0.44, r:0.08, oyun:{x:0.88, y:0.50}}
];

let controls = JSON.parse(JSON.stringify(DEFAULT_CONTROLS));
try {
  const savedProfile = localStorage.getItem('m2t_controls_v2');
  if (savedProfile) {
    const parsed = JSON.parse(savedProfile);
    if (Array.isArray(parsed) && parsed.length > 0) controls = parsed;
  }
} catch(e) {}

function saveControls(){
  try { localStorage.setItem('m2t_controls_v2', JSON.stringify(controls)); } catch(e) {}
}

let TV_ORAN = 16/9;
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const info = document.getElementById('info'), modeBtn = document.getElementById('modeBtn');
const editBtn = document.getElementById('editBtn'), resetBtn = document.getElementById('resetBtn');
let W=0, H=0, area={x:0,y:0,w:0,h:0};
const MODES = ['imlec', 'ayna', 'kumanda'];
let mode = 'imlec';
try {
  const saved = localStorage.getItem('m2t_mode');
  if (MODES.includes(saved)) mode = saved;
} catch(e) {}

// Touchpad (IMLEC) durumu
let curX = 0.5, curY = 0.5;
let scrollState = null; // 2 parmak kaydirma durumu: {sx, sy, lx, ly}
let gestureMultiTouch = false;

// Kumanda kalibrasyon durumu
let editMode = false;
let selectedCtrl = null;

window.setOran = function(w, h) {
  if (w > 0 && h > 0) {
    TV_ORAN = w / h;
    resize();
  }
};

function updateTopBar(){
  modeBtn.textContent = 'Mod: ' + mode.toUpperCase();
  if (mode === 'kumanda') {
    editBtn.style.display = 'inline-block';
    resetBtn.style.display = editMode ? 'inline-block' : 'none';
    editBtn.classList.toggle('active', editMode);
    editBtn.textContent = editMode ? 'Kaydet / Bitir' : 'Tus Hedefi Ayarla';
  } else {
    editMode = false;
    selectedCtrl = null;
    editBtn.style.display = 'none';
    resetBtn.style.display = 'none';
  }
}

function resize(){
  const d = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W*d; cv.height = H*d;
  cx.setTransform(d,0,0,d,0,0);
  let aw = W, ah = W/TV_ORAN;
  if (ah > H) { ah = H; aw = H*TV_ORAN; }
  area = {x:(W-aw)/2, y:(H-ah)/2, w:aw, h:ah};
  updateTopBar();
  draw();
}
addEventListener('resize', resize);

function send(a,id,nx,ny){
  nx = Math.min(1, Math.max(0, nx)); ny = Math.min(1, Math.max(0, ny));
  try { if (window.Android) Android.touch(a,id,nx,ny); } catch(e) {}
}

// Parmak kimligi -> kucuk tamsayi
const idmap = new Map();
function pid(t){
  if (!idmap.has(t.identifier)) {
    const used = new Set(idmap.values()); let n = 0;
    while (used.has(n)) n++;
    idmap.set(t.identifier, n);
  }
  return idmap.get(t.identifier);
}
const active = new Map(); // touch.identifier -> durum

function hit(x,y){
  for (const c of controls) {
    const dx = x - c.x*W, dy = y - c.y*H;
    if (Math.hypot(dx,dy) <= c.r*H) return c;
  }
  return null;
}

function stopTwoFingerScroll(){
  if (scrollState) {
    send(1, 0, scrollState.sx, scrollState.sy);
    scrollState = null;
  }
}

function onStart(e){
  e.preventDefault();
  const now = performance.now();

  if (mode === 'imlec') {
    if (e.touches.length >= 2) {
      gestureMultiTouch = true;
      for (const a of active.values()) {
        if (a.holdTimer) { clearTimeout(a.holdTimer); a.holdTimer = null; }
        if (a.dragging) { send(1, a.p, curX, curY); a.dragging = false; }
      }
      const t0 = e.touches[0], t1 = e.touches[1];
      const mx = (t0.clientX + t1.clientX) / 2;
      const my = (t0.clientY + t1.clientY) / 2;
      if (!scrollState) {
        const startX = Math.min(0.85, Math.max(0.15, curX));
        const startY = Math.min(0.85, Math.max(0.15, curY));
        scrollState = { sx: startX, sy: startY, lx: mx, ly: my };
        send(0, 0, scrollState.sx, scrollState.sy);
      } else {
        scrollState.lx = mx;
        scrollState.ly = my;
      }
      info.textContent = 'KAYDIRMA (2P)';
      draw();
      return;
    }

    gestureMultiTouch = false;
    for (const t of e.changedTouches) {
      const x = t.clientX, y = t.clientY, p = pid(t);
      const state = {
        kind: 'trackpad', p,
        sx: x, sy: y, lx: x, ly: y,
        t0: now, moved: false, dragging: false, holdTimer: null
      };
      state.holdTimer = setTimeout(() => {
        if (!state.moved && !gestureMultiTouch && active.has(t.identifier)) {
          state.dragging = true;
          send(0, state.p, curX, curY);
          info.textContent = 'SURUKLE: ' + curX.toFixed(2) + ',' + curY.toFixed(2);
          draw();
        }
      }, 380);
      active.set(t.identifier, state);
      send(3, p, curX, curY);
      info.textContent = curX.toFixed(3) + ' , ' + curY.toFixed(3);
    }
    draw();
    return;
  }

  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    if (mode === 'ayna') {
      if (x < area.x || x > area.x+area.w || y < area.y || y > area.y+area.h) continue;
      const nx = (x-area.x)/area.w, ny = (y-area.y)/area.h, p = pid(t);
      active.set(t.identifier, {kind:'pad', p, nx, ny});
      send(0,p,nx,ny);
      info.textContent = nx.toFixed(3)+' , '+ny.toFixed(3);
    } else if (mode === 'kumanda') {
      if (editMode) {
        const c = hit(x,y);
        if (c) {
          selectedCtrl = c;
          active.set(t.identifier, {kind:'edit_btn', c, lx:x, ly:y});
          send(3, 0, c.oyun.x, c.oyun.y);
          info.textContent = c.ad + ' -> ' + c.oyun.x.toFixed(2) + ',' + c.oyun.y.toFixed(2);
        } else if (selectedCtrl) {
          active.set(t.identifier, {kind:'edit_target', c:selectedCtrl, lx:x, ly:y});
          send(3, 0, selectedCtrl.oyun.x, selectedCtrl.oyun.y);
        }
      } else {
        const c = hit(x,y); if (!c) continue;
        const p = pid(t);
        active.set(t.identifier, {kind:c.tip, c, p, nx:c.oyun.x, ny:c.oyun.y, kx:0, ky:0});
        send(0,p,c.oyun.x,c.oyun.y);
        info.textContent = c.ad + ' (' + c.oyun.x.toFixed(2) + ',' + c.oyun.y.toFixed(2) + ')';
      }
    }
  }
  draw();
}

function onMove(e){
  e.preventDefault();

  if (mode === 'imlec') {
    if (e.touches.length >= 2 && scrollState) {
      const t0 = e.touches[0], t1 = e.touches[1];
      const mx = (t0.clientX + t1.clientX) / 2;
      const my = (t0.clientY + t1.clientY) / 2;
      const dx = mx - scrollState.lx;
      const dy = my - scrollState.ly;
      scrollState.lx = mx;
      scrollState.ly = my;

      const scrollSens = 1.15;
      let nextX = scrollState.sx + (dx / area.w) * scrollSens;
      let nextY = scrollState.sy + (dy / area.h) * scrollSens;

      if (nextX < 0.06 || nextX > 0.94 || nextY < 0.06 || nextY > 0.94) {
        send(1, 0, scrollState.sx, scrollState.sy);
        scrollState.sx = Math.min(0.85, Math.max(0.15, curX));
        scrollState.sy = Math.min(0.85, Math.max(0.15, curY));
        send(0, 0, scrollState.sx, scrollState.sy);
      } else {
        scrollState.sx = nextX;
        scrollState.sy = nextY;
        send(2, 0, scrollState.sx, scrollState.sy);
      }
      draw();
      return;
    }

    for (const t of e.changedTouches) {
      const a = active.get(t.identifier); if (!a || a.kind !== 'trackpad') continue;
      if (gestureMultiTouch) continue;
      const x = t.clientX, y = t.clientY;
      const dx = x - a.lx, dy = y - a.ly;
      a.lx = x; a.ly = y;
      if (Math.hypot(x - a.sx, y - a.sy) > 9) {
        a.moved = true;
        if (a.holdTimer) { clearTimeout(a.holdTimer); a.holdTimer = null; }
      }
      const sens = 1.25;
      curX = Math.min(1, Math.max(0, curX + (dx / area.w) * sens));
      curY = Math.min(1, Math.max(0, curY + (dy / area.h) * sens));
      if (a.dragging) {
        send(2, a.p, curX, curY);
      } else {
        send(3, a.p, curX, curY);
      }
      info.textContent = curX.toFixed(3)+' , '+curY.toFixed(3);
    }
    draw();
    return;
  }

  for (const t of e.changedTouches) {
    const a = active.get(t.identifier); if (!a) continue;
    const x = t.clientX, y = t.clientY;
    if (a.kind === 'pad') {
      a.nx = (x-area.x)/area.w; a.ny = (y-area.y)/area.h;
      send(2,a.p,a.nx,a.ny);
      info.textContent = Math.min(1,Math.max(0,a.nx)).toFixed(3)+' , '+Math.min(1,Math.max(0,a.ny)).toFixed(3);
    } else if (a.kind === 'cubuk') {
      const c = a.c, R = c.r*H;
      let dx = (x - c.x*W)/R, dy = (y - c.y*H)/R;
      const len = Math.hypot(dx,dy);
      if (len > 1) { dx /= len; dy /= len; }
      a.kx = dx; a.ky = dy;
      a.nx = c.oyun.x + dx*c.menzil/TV_ORAN;
      a.ny = c.oyun.y + dy*c.menzil;
      send(2,a.p,a.nx,a.ny);
    } else if (a.kind === 'edit_btn' || a.kind === 'edit_target') {
      const c = a.c;
      const dx = x - a.lx, dy = y - a.ly;
      a.lx = x; a.ly = y;
      c.oyun.x = Math.min(0.98, Math.max(0.02, c.oyun.x + (dx / area.w)));
      c.oyun.y = Math.min(0.98, Math.max(0.02, c.oyun.y + (dy / area.h)));
      saveControls();
      send(3, 0, c.oyun.x, c.oyun.y);
      info.textContent = c.ad + ' -> ' + c.oyun.x.toFixed(2) + ',' + c.oyun.y.toFixed(2);
    }
  }
  draw();
}

function onEnd(e){
  e.preventDefault();
  const now = performance.now();

  if (mode === 'imlec') {
    if (scrollState && e.touches.length < 2) {
      stopTwoFingerScroll();
    }
    for (const t of e.changedTouches) {
      const a = active.get(t.identifier);
      if (a) {
        if (a.holdTimer) { clearTimeout(a.holdTimer); a.holdTimer = null; }
        if (a.dragging) {
          send(1, a.p, curX, curY);
        } else if (!gestureMultiTouch && !a.moved && (now - a.t0) < 300) {
          const p = a.p;
          const tx = curX, ty = curY;
          send(0, p, tx, ty);
          setTimeout(() => send(1, p, tx, ty), 40);
        }
        active.delete(t.identifier);
      }
      idmap.delete(t.identifier);
    }
    if (e.touches.length === 0) {
      gestureMultiTouch = false;
    }
    draw();
    return;
  }

  for (const t of e.changedTouches) {
    const a = active.get(t.identifier); if (!a) continue;
    if (a.kind === 'pad' || a.kind === 'cubuk' || a.kind === 'dugme') {
      send(1,a.p,a.nx,a.ny);
    }
    active.delete(t.identifier);
    idmap.delete(t.identifier);
  }
  draw();
}

['touchstart','touchmove','touchend','touchcancel'].forEach((n,i)=>{
  cv.addEventListener(n, [onStart,onMove,onEnd,onEnd][i], {passive:false});
});

modeBtn.addEventListener('click', ()=>{
  stopTwoFingerScroll();
  const idx = (MODES.indexOf(mode) + 1) % MODES.length;
  mode = MODES[idx];
  try { localStorage.setItem('m2t_mode', mode); } catch(e) {}
  info.textContent = '-';
  updateTopBar();
  draw();
});

editBtn.addEventListener('click', ()=>{
  editMode = !editMode;
  if (editMode && !selectedCtrl) selectedCtrl = controls[0];
  if (editMode && selectedCtrl) {
    send(3, 0, selectedCtrl.oyun.x, selectedCtrl.oyun.y);
    info.textContent = selectedCtrl.ad + ' -> ' + selectedCtrl.oyun.x.toFixed(2) + ',' + selectedCtrl.oyun.y.toFixed(2);
  } else {
    info.textContent = 'Kaydedildi';
  }
  updateTopBar();
  draw();
});

resetBtn.addEventListener('click', ()=>{
  controls = JSON.parse(JSON.stringify(DEFAULT_CONTROLS));
  saveControls();
  selectedCtrl = controls[0];
  info.textContent = 'Varsayilana donuldu';
  draw();
});

document.getElementById('syncBtn').addEventListener('click', ()=>{
  try { if (window.Android && Android.refreshFromGithub) Android.refreshFromGithub(); } catch(e) {}
});

function draw(){
  cx.fillStyle = '#0b0e14'; cx.fillRect(0,0,W,H);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  if (mode === 'imlec') {
    cx.strokeStyle = scrollState ? '#ff9f43' : '#2a3350';
    cx.lineWidth = 2; cx.setLineDash([8,6]);
    cx.strokeRect(area.x, area.y, area.w, area.h); cx.setLineDash([]);
    cx.fillStyle = '#4da3ff'; cx.font = '16px system-ui';
    cx.fillText('1 Parmak: Imleci Gezdir & Dokunarak Tikla | 2 Parmak: Sayfa Kaydir (Scroll)', W/2, H/2 - 14);
    cx.fillStyle = '#5c6b9c'; cx.font = '13px system-ui';
    cx.fillText('(Nesne tasimak/suruklemek icin 1 parmagi 0.4 sn basili tutup kaydirin)', W/2, H/2 + 16);
    const px = area.x + curX * area.w, py = area.y + curY * area.h;
    cx.strokeStyle = scrollState ? '#ff9f43' : '#4da3ff'; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(px, py, 12, 0, Math.PI*2); cx.stroke();
    return;
  }
  if (mode === 'ayna') {
    cx.strokeStyle = '#2a3350'; cx.lineWidth = 2; cx.setLineDash([8,6]);
    cx.strokeRect(area.x, area.y, area.w, area.h); cx.setLineDash([]);
    cx.fillStyle = '#34406a'; cx.font = '16px system-ui';
    cx.fillText('AYNA: Dokundugunuz nokta birebir oyuna gider', W/2, H/2);
    cx.fillText('(oyundaki dugmelerin koordinatini ustten okuyun)', W/2, H/2+26);
    return;
  }
  if (editMode) {
    cx.fillStyle = '#ff9f43'; cx.font = '15px system-ui';
    cx.fillText('AYAR MODU: Bir tusa dokunun, ardindan parmaginizi kaydirarak TV\'deki mavi imleci oyundaki tusun uzerine getirin', W/2, 54);
  }
  for (const c of controls) {
    const px = c.x*W, py = c.y*H, R = c.r*H;
    let st = null;
    for (const a of active.values()) if (a.c === c) st = a;
    const isSel = editMode && selectedCtrl === c;
    cx.lineWidth = isSel ? 4 : 3;
    cx.strokeStyle = isSel ? '#ff9f43' : (st ? '#4da3ff' : '#2a3350');
    cx.beginPath(); cx.arc(px,py,R,0,Math.PI*2); cx.stroke();
    if (c.tip === 'cubuk') {
      const kx = (st && st.kx) ? st.kx : 0, ky = (st && st.ky) ? st.ky : 0;
      cx.fillStyle = isSel ? '#ff9f43' : (st ? '#4da3ff' : '#1d2644');
      cx.beginPath(); cx.arc(px+kx*R, py+ky*R, R*0.38, 0, Math.PI*2); cx.fill();
    } else {
      if (st || isSel) {
        cx.fillStyle = isSel ? 'rgba(255,159,67,.25)' : 'rgba(77,163,255,.35)';
        cx.beginPath(); cx.arc(px,py,R,0,Math.PI*2); cx.fill();
      }
      cx.fillStyle = '#cfd8ff'; cx.font = 'bold 20px system-ui';
      cx.fillText(c.ad || '', px, py);
    }
    if (editMode) {
      cx.fillStyle = '#8fa4d4'; cx.font = '11px monospace';
      cx.fillText(c.oyun.x.toFixed(2)+','+c.oyun.y.toFixed(2), px, py + R + 14);
    }
  }
}
/* ---------- Uygulama degistirici + Geri ---------- */
const panel = document.getElementById('panel'), applist = document.getElementById('applist');
const q = document.getElementById('q');
let APPS = null;
function loadApps(){
  if (APPS) return APPS;
  try { APPS = JSON.parse((window.Android && Android.apps) ? Android.apps() : '[]'); } catch(e) { APPS = []; }
  return APPS;
}
function getRecent(){ try { return JSON.parse(localStorage.getItem('m2t_recent') || '[]'); } catch(e) { return []; } }
function pushRecent(c){
  try { localStorage.setItem('m2t_recent', JSON.stringify([c, ...getRecent().filter(x => x !== c)].slice(0,8))); } catch(e) {}
}
function renderApps(){
  const f = q.value.trim().toLowerCase(), rec = getRecent();
  const items = loadApps().filter(a => !f || a.n.toLowerCase().includes(f));
  if (!f) items.sort((a,b) => {
    const ra = rec.indexOf(a.c), rb = rec.indexOf(b.c);
    if (ra >= 0 || rb >= 0) { if (ra < 0) return 1; if (rb < 0) return -1; return ra - rb; }
    return a.n.localeCompare(b.n, 'tr');
  });
  applist.textContent = '';
  for (const a of items) {
    const b = document.createElement('button');
    b.textContent = a.n;
    b.addEventListener('click', () => {
      pushRecent(a.c);
      try { Android.launch(a.c); } catch(e) {}
      panel.style.display = 'none';
    });
    applist.appendChild(b);
  }
}
document.getElementById('appBtn').addEventListener('click', () => {
  q.value = ''; renderApps(); panel.style.display = 'flex';
});
document.getElementById('closeBtn').addEventListener('click', () => { panel.style.display = 'none'; });
q.addEventListener('input', renderApps);
document.getElementById('backBtn').addEventListener('click', () => { try { Android.back(); } catch(e) {} });

resize();
</script>
</body>
</html>
