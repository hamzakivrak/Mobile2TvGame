<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kumanda</title>
<style>
  :root{--bg:#0b0e14;--line:#2a3350;--acc:#4da3ff;--txt:#cfd8ff}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif;color:var(--txt)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #bar{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:2}
  #bar button{background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px}
  #info{font:12px monospace;opacity:.85;min-width:130px;text-align:center}
  #panel{position:fixed;inset:0;background:rgba(11,14,20,.97);z-index:3;display:none;flex-direction:column;
    padding:10px 16px;box-sizing:border-box}
  #panel .top{display:flex;gap:10px;margin-bottom:10px}
  #q{flex:1;background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
  #panel .top button{background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:15px}
  #applist{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;
    align-content:start;touch-action:pan-y}
  #applist button{background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:10px;
    padding:14px 10px;font-size:15px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar">
  <button id="modeBtn">Mod: AYNA</button>
  <button id="appBtn">Uygulamalar</button>
  <button id="backBtn">Geri</button>
  <span id="info">-</span>
</div>

<div id="panel">
  <div class="top">
    <input id="q" type="search" placeholder="Uygulama ara...">
    <button id="closeBtn">Kapat</button>
  </div>
  <div id="applist"></div>
</div>

<script>
/* ============ PROFIL (buradan degistirin; APK'yi yeniden derlemek gerekmez) ============
   Koordinatlar 0..1 araligindadir (sol-ust = 0,0).
   - x,y,r  : KUMANDA ekranindaki yer (x: ekran genisligi orani, y: ekran yuksekligi orani,
              r: yaricap, ekran YUKSEKLIGI orani)
   - oyun   : oyunun KENDI ekran kontrolunun TV'deki yeri. Ogrenmek icin AYNA modunda
              oyundaki dugmeye dokunun, ustteki sayilari okuyun.
   - menzil : cubugun oyunda ne kadar uzaga gidecegi (oyun ekran yuksekligi orani)
   Asagidaki degerler ORNEKTIR; kendi oyununuza gore ayarlanmalidir. */
const PROFILE = {
  ad: "Ornek profil",
  kontroller: [
    {tip:"cubuk", x:0.14, y:0.66, r:0.17, oyun:{x:0.15, y:0.72}, menzil:0.14},
    {tip:"dugme", ad:"A", x:0.86, y:0.70, r:0.10, oyun:{x:0.86, y:0.78}},
    {tip:"dugme", ad:"B", x:0.70, y:0.82, r:0.08, oyun:{x:0.75, y:0.88}}
  ]
};
const TV_ORAN = 16/9;   // TV'deki sanal ekran orani (1920x1080)
/* ================================================================================== */

const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const info = document.getElementById('info'), modeBtn = document.getElementById('modeBtn');
let W=0,H=0,area={x:0,y:0,w:0,h:0};
let mode = 'ayna';
try { mode = localStorage.getItem('m2t_mode') || 'ayna'; } catch(e) {}

function resize(){
  const d = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W*d; cv.height = H*d;
  cx.setTransform(d,0,0,d,0,0);
  let aw = W, ah = W/TV_ORAN;
  if (ah > H) { ah = H; aw = H*TV_ORAN; }
  area = {x:(W-aw)/2, y:(H-ah)/2, w:aw, h:ah};
  draw();
}
addEventListener('resize', resize);

function send(a,id,nx,ny){
  nx = Math.min(1, Math.max(0, nx)); ny = Math.min(1, Math.max(0, ny));
  try { if (window.Android) Android.touch(a,id,nx,ny); } catch(e) {}
}

// Parmak kimligi -> kucuk tamsayi
const idmap = new Map();
function pid(t){
  if (!idmap.has(t.identifier)) {
    const used = new Set(idmap.values()); let n = 0;
    while (used.has(n)) n++;
    idmap.set(t.identifier, n);
  }
  return idmap.get(t.identifier);
}
const active = new Map(); // touch.identifier -> durum

function hit(x,y){
  for (const c of PROFILE.kontroller) {
    const dx = x - c.x*W, dy = y - c.y*H;
    if (Math.hypot(dx,dy) <= c.r*H) return c;
  }
  return null;
}

function onStart(e){
  e.preventDefault();
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    if (mode === 'ayna') {
      if (x < area.x || x > area.x+area.w || y < area.y || y > area.y+area.h) continue;
      const nx = (x-area.x)/area.w, ny = (y-area.y)/area.h, p = pid(t);
      active.set(t.identifier, {kind:'pad', p, nx, ny});
      send(0,p,nx,ny);
      info.textContent = nx.toFixed(3)+' , '+ny.toFixed(3);
    } else {
      const c = hit(x,y); if (!c) continue;
      const p = pid(t);
      active.set(t.identifier, {kind:c.tip, c, p, nx:c.oyun.x, ny:c.oyun.y, kx:0, ky:0});
      send(0,p,c.oyun.x,c.oyun.y);
    }
  }
  draw();
}

function onMove(e){
  e.preventDefault();
  for (const t of e.changedTouches) {
    const a = active.get(t.identifier); if (!a) continue;
    const x = t.clientX, y = t.clientY;
    if (a.kind === 'pad') {
      a.nx = (x-area.x)/area.w; a.ny = (y-area.y)/area.h;
      send(2,a.p,a.nx,a.ny);
      info.textContent = Math.min(1,Math.max(0,a.nx)).toFixed(3)+' , '+Math.min(1,Math.max(0,a.ny)).toFixed(3);
    } else if (a.kind === 'cubuk') {
      const c = a.c, R = c.r*H;
      let dx = (x - c.x*W)/R, dy = (y - c.y*H)/R;
      const len = Math.hypot(dx,dy);
      if (len > 1) { dx /= len; dy /= len; }
      a.kx = dx; a.ky = dy;
      a.nx = c.oyun.x + dx*c.menzil/TV_ORAN;   // menzil oyun YUKSEKLIGINE gore
      a.ny = c.oyun.y + dy*c.menzil;
      send(2,a.p,a.nx,a.ny);
    }
  }
  draw();
}

function onEnd(e){
  e.preventDefault();
  for (const t of e.changedTouches) {
    const a = active.get(t.identifier); if (!a) continue;
    send(1,a.p,a.nx,a.ny);
    active.delete(t.identifier);
    idmap.delete(t.identifier);
  }
  draw();
}

['touchstart','touchmove','touchend','touchcancel'].forEach((n,i)=>{
  cv.addEventListener(n, [onStart,onMove,onEnd,onEnd][i], {passive:false});
});

modeBtn.addEventListener('click', ()=>{
  mode = (mode === 'ayna') ? 'kumanda' : 'ayna';
  try { localStorage.setItem('m2t_mode', mode); } catch(e) {}
  modeBtn.textContent = 'Mod: ' + mode.toUpperCase();
  info.textContent = '-';
  draw();
});
modeBtn.textContent = 'Mod: ' + mode.toUpperCase();

function draw(){
  cx.fillStyle = '#0b0e14'; cx.fillRect(0,0,W,H);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  if (mode === 'ayna') {
    cx.strokeStyle = '#2a3350'; cx.lineWidth = 2; cx.setLineDash([8,6]);
    cx.strokeRect(area.x, area.y, area.w, area.h); cx.setLineDash([]);
    cx.fillStyle = '#34406a'; cx.font = '16px system-ui';
    cx.fillText('TV ekrani: dokunus birebir oyuna gider', W/2, H/2);
    cx.fillText('(oyundaki dugmelerin koordinatini ustten okuyun)', W/2, H/2+26);
    return;
  }
  for (const c of PROFILE.kontroller) {
    const px = c.x*W, py = c.y*H, R = c.r*H;
    let st = null;
    for (const a of active.values()) if (a.c === c) st = a;
    cx.lineWidth = 3;
    cx.strokeStyle = st ? '#4da3ff' : '#2a3350';
    cx.beginPath(); cx.arc(px,py,R,0,Math.PI*2); cx.stroke();
    if (c.tip === 'cubuk') {
      const kx = st ? st.kx : 0, ky = st ? st.ky : 0;
      cx.fillStyle = st ? '#4da3ff' : '#1d2644';
      cx.beginPath(); cx.arc(px+kx*R, py+ky*R, R*0.38, 0, Math.PI*2); cx.fill();
    } else {
      if (st) { cx.fillStyle = 'rgba(77,163,255,.35)'; cx.beginPath(); cx.arc(px,py,R,0,Math.PI*2); cx.fill(); }
      cx.fillStyle = '#cfd8ff'; cx.font = 'bold 22px system-ui';
      cx.fillText(c.ad || '', px, py);
    }
  }
}
/* ---------- Uygulama degistirici + Geri ---------- */
const panel = document.getElementById('panel'), applist = document.getElementById('applist');
const q = document.getElementById('q');
let APPS = null;
function loadApps(){
  if (APPS) return APPS;
  try { APPS = JSON.parse((window.Android && Android.apps) ? Android.apps() : '[]'); } catch(e) { APPS = []; }
  return APPS;
}
function getRecent(){ try { return JSON.parse(localStorage.getItem('m2t_recent') || '[]'); } catch(e) { return []; } }
function pushRecent(c){
  try { localStorage.setItem('m2t_recent', JSON.stringify([c, ...getRecent().filter(x => x !== c)].slice(0,8))); } catch(e) {}
}
function renderApps(){
  const f = q.value.trim().toLowerCase(), rec = getRecent();
  const items = loadApps().filter(a => !f || a.n.toLowerCase().includes(f));
  if (!f) items.sort((a,b) => {
    const ra = rec.indexOf(a.c), rb = rec.indexOf(b.c);
    if (ra >= 0 || rb >= 0) { if (ra < 0) return 1; if (rb < 0) return -1; return ra - rb; }
    return a.n.localeCompare(b.n, 'tr');
  });
  applist.textContent = '';
  for (const a of items) {
    const b = document.createElement('button');
    b.textContent = a.n;
    b.addEventListener('click', () => {
      pushRecent(a.c);
      try { Android.launch(a.c); } catch(e) {}
      panel.style.display = 'none';
    });
    applist.appendChild(b);
  }
}
document.getElementById('appBtn').addEventListener('click', () => {
  q.value = ''; renderApps(); panel.style.display = 'flex';
});
document.getElementById('closeBtn').addEventListener('click', () => { panel.style.display = 'none'; });
q.addEventListener('input', renderApps);
document.getElementById('backBtn').addEventListener('click', () => { try { Android.back(); } catch(e) {} });

resize();
</script>
</body>
</html>
